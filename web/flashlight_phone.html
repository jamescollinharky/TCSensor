<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Screen flash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background 0.05s linear; }
    body.on { background: #fff; }
    body.off { background: #000; }
    .controls { position: fixed; bottom: env(safe-area-inset-bottom, 20px); left: 0; right: 0; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; z-index: 1; }
    .controls label { color: rgba(255,255,255,0.9); font-size: 14px; }
    body.on .controls label { color: rgba(0,0,0,0.7); }
    select { font-size: 16px; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); }
    body.on select { background: rgba(0,0,0,0.1); color: #000; border-color: rgba(0,0,0,0.2); }
    button { font-size: 16px; padding: 10px 20px; border-radius: 8px; border: none; background: rgba(255,255,255,0.3); color: #fff; cursor: pointer; }
    body.on button { background: rgba(0,0,0,0.15); color: #000; }
    button:active { opacity: 0.8; }
    .hint { position: fixed; top: env(safe-area-inset-top, 24px); left: 12px; right: 12px; text-align: center; font-size: 13px; color: rgba(255,255,255,0.6); z-index: 1; }
    body.on .hint { color: rgba(0,0,0,0.5); }
  </style>
</head>
<body class="off">
  <p class="hint">Point the camera at this screen. Tap anywhere to start/stop flash.</p>
  <div class="controls">
    <label for="hz">Flash (Hz):</label>
    <select id="hz">
      <option value="0.25">0.25</option>
      <option value="0.5">0.5</option>
      <option value="0.75">0.75</option>
      <option value="1" selected>1</option>
      <option value="1.25">1.25</option>
      <option value="1.5">1.5</option>
      <option value="1.75">1.75</option>
      <option value="2">2</option>
      <option value="2.25">2.25</option>
      <option value="2.5">2.5</option>
      <option value="2.75">2.75</option>
      <option value="3">3</option>
      <option value="3.5">3.5</option>
      <option value="4">4</option>
      <option value="4.5">4.5</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="12">12</option>
      <option value="15">15</option>
      <option value="20">20</option>
    </select>
    <button type="button" id="steady">Steady white</button>
  </div>
  <script>
    (function () {
      const body = document.body;
      let timer = null;
      let flashing = false;
      let isOn = false;

      function stopFlash() {
        if (timer) clearInterval(timer);
        timer = null;
        flashing = false;
      }

      function setWhite() {
        body.classList.remove('off');
        body.classList.add('on');
        isOn = true;
      }

      function setBlack() {
        body.classList.remove('on');
        body.classList.add('off');
        isOn = false;
      }

      function toggle() {
        isOn ? setBlack() : setWhite();
      }

      function startFlash() {
        stopFlash();
        const hz = Math.max(0.1, parseFloat(document.getElementById('hz').value) || 1);
        const periodMs = 1000 / hz;
        setBlack();
        flashing = true;
        timer = setInterval(toggle, periodMs / 2);
      }

      document.body.addEventListener('click', function (e) {
        if (e.target.closest('.controls')) return;
        if (flashing) {
          stopFlash();
          setBlack();
        } else {
          startFlash();
        }
      });

      document.getElementById('hz').addEventListener('change', function () {
        if (flashing) startFlash();
      });

      document.getElementById('steady').addEventListener('click', function () {
        stopFlash();
        setWhite();
      });
    })();
  </script>
</body>
</html>
